name: Computer Connector CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev
      - name: Worker install and stability tests
        working-directory: worker
        run: npm ci --omit=dev && npm run test:stability && npm audit --omit=dev
